<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Autoreview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --line: #e4e4e0; --text: #1c1c1a; --muted: #6d6d68;
  --accent: #d9480f; --ok: #2b8a3e; --warn: #b7791f; --err: #c92a2a; --info: #1c64b8;
  --chip: #efefeb; --code: #f1f1ed;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --panel: #1b1b19; --line: #2c2c29; --text: #ececE8; --muted: #94948d;
    --accent: #ff7a3d; --ok: #51cf66; --warn: #f2b84b; --err: #ff6b6b; --info: #6aa9ff;
    --chip: #262623; --code: #232320;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; background: var(--chip); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.err { background: var(--err); } .dot.live { background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.spacer { flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 16px 24px 0; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); }
main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px 24px 24px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.list { max-height: calc(100vh - 330px); overflow: auto; }
.row { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--chip); } .row.sel { background: var(--chip); box-shadow: inset 3px 0 var(--accent); }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: var(--chip); }
.badge.posted { color: var(--ok); } .badge.failed { color: var(--err); } .badge.dry { color: var(--info); } .badge.live { color: var(--accent); }
.polls { font-family: var(--mono); font-size: 12px; color: var(--muted); max-height: 160px; overflow: auto; padding: 6px 14px; }
.polls div { display: flex; gap: 10px; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.detail-head { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.detail-head .t { font-size: 16px; font-weight: 600; }
.detail-head a { color: var(--info); text-decoration: none; }
.detail-head .m { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-top: 4px; }
.cols { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; }
.timeline { border-right: 1px solid var(--line); max-height: calc(100vh - 300px); overflow: auto; padding: 8px 0; font-size: 12px; }
.step { display: grid; grid-template-columns: 56px 1fr; gap: 6px; padding: 3px 14px; }
.step .k { font-weight: 600; color: var(--accent); }
.step .v { font-family: var(--mono); color: var(--muted); word-break: break-all; }
.step.text .k { color: var(--info); } .step.text .v { font-family: inherit; color: var(--text); }
.step.res .k { color: var(--ok); }
.review { padding: 4px 22px 22px; max-height: calc(100vh - 300px); overflow: auto; }
.review h2 { font-size: 17px; } .review h3 { font-size: 15px; margin-top: 22px; }
.review code { font-family: var(--mono); font-size: 12px; background: var(--code); padding: 1px 4px; border-radius: 3px; }
.review pre { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; }
.review pre code { background: none; padding: 0; }
.waiting { color: var(--muted); padding: 30px 0; display: flex; gap: 10px; align-items: center; }
@media (max-width: 900px) {
  header { padding: 12px 16px; } .stats { grid-template-columns: repeat(2, 1fr); padding: 12px 16px 0; }
  main { grid-template-columns: 1fr; padding: 12px 16px; } .cols { grid-template-columns: 1fr; }
  .timeline { border-right: 0; border-bottom: 1px solid var(--line); max-height: 260px; }
}
</style>
</head>
<body>
<header>
  <h1>🔥 PR <span>autoreview</span></h1>
  <span class="pill" id="agent"><span class="dot"></span><span>…</span></span>
  <span class="pill" id="sse"><span class="dot"></span><span>live</span></span>
  <span class="spacer"></span>
  <button id="toggle">Pause</button>
  <button class="primary" id="runNow">Lancer un poll</button>
</header>

<section class="stats">
  <div class="stat"><b id="sPosted">0</b><small>reviews postées</small></div>
  <div class="stat"><b id="sToday">0</b><small>aujourd'hui</small></div>
  <div class="stat"><b id="sCost">$0</b><small>coût total</small></div>
  <div class="stat"><b id="sDur">–</b><small>durée moyenne</small></div>
  <div class="stat"><b id="sFail">0</b><small>échecs</small></div>
</section>

<main>
  <div>
    <div class="panel"><h2>Reviews</h2><div class="list" id="list"></div></div>
    <div class="panel" style="margin-top:16px"><h2>Polls</h2><div class="polls" id="polls"></div></div>
  </div>
  <div class="panel" id="detail"><div class="empty">Aucune review sélectionnée</div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (ts) => {
  const s = Math.round((Date.now() - new Date(ts)) / 1000);
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)} min` : s < 86400 ? `${Math.floor(s / 3600)} h` : `${Math.floor(s / 86400)} j`;
};
const fmtDur = (ms) => !ms ? '–' : ms < 60000 ? `${Math.round(ms / 1000)}s` : `${Math.floor(ms / 60000)}m${String(Math.round(ms / 1000) % 60).padStart(2, '0')}`;

let agent = {}, reviews = new Map(), polls = [], selected = null, streams = new Map();

function applyEvent(ev) {
  if (ev.type === 'poll_start') polls.unshift(ev);
  if (ev.type === 'poll_error') polls.unshift({ ...ev, error: true });
  if (!ev.id) return;
  const r = reviews.get(ev.id) ?? { id: ev.id, status: 'live' };
  if (ev.type === 'review_start') Object.assign(r, ev, { started: ev.ts, status: 'live' });
  if (ev.type === 'review_done') Object.assign(r, { cost: ev.cost, duration_ms: ev.duration_ms, turns: ev.turns });
  if (ev.type === 'posted') Object.assign(r, { status: 'posted', comment_url: ev.comment_url, ended: ev.ts });
  if (ev.type === 'dry_run') Object.assign(r, { status: 'dry', ended: ev.ts });
  if (ev.type === 'review_failed') Object.assign(r, { status: 'failed', reason: ev.reason, ended: ev.ts });
  reviews.set(ev.id, r);
}

const LABEL = { live: 'en cours', posted: 'postée', dry: 'dry run', failed: 'échec' };

function renderList() {
  const all = [...reviews.values()].sort((a, b) => (b.started ?? '').localeCompare(a.started ?? ''));
  $('list').innerHTML = all.length ? all.map((r) => `
    <div class="row ${r.id === selected ? 'sel' : ''}" data-id="${esc(r.id)}">
      <div class="t">#${esc(r.pr)} ${esc(r.title)}</div>
      <div class="m"><span class="badge ${r.status}">${r.status === 'live' ? '● ' : ''}${LABEL[r.status]}</span>
        <span>@${esc(r.author)}</span><span>${r.started ? ago(r.started) : ''}</span>
        ${r.duration_ms ? `<span>${fmtDur(r.duration_ms)}</span>` : ''}${r.cost ? `<span>$${r.cost.toFixed(2)}</span>` : ''}</div>
    </div>`).join('') : '<div class="empty">Pas encore de review.<br>La prochaine PR d\'un collègue apparaîtra ici.</div>';
  $('list').querySelectorAll('.row').forEach((el) => el.onclick = () => select(el.dataset.id));

  const done = all.filter((r) => r.status === 'posted');
  const today = new Date().toDateString();
  $('sPosted').textContent = done.length;
  $('sToday').textContent = done.filter((r) => new Date(r.started).toDateString() === today).length;
  $('sCost').textContent = '$' + all.reduce((s, r) => s + (r.cost || 0), 0).toFixed(2);
  const durs = all.map((r) => r.duration_ms).filter(Boolean);
  $('sDur').textContent = durs.length ? fmtDur(durs.reduce((a, b) => a + b) / durs.length) : '–';
  $('sFail').textContent = all.filter((r) => r.status === 'failed').length;

  $('polls').innerHTML = polls.slice(0, 40).map((p) => `<div><span>${new Date(p.ts).toLocaleTimeString('fr-FR')}</span>
    <span>${p.error ? `<span style="color:var(--err)">${esc(p.reason)}</span>` : `${p.open} ouvertes · ${p.new ? `<b style="color:var(--accent)">${p.new} nouvelle(s)</b>` : '0 nouvelle'}`}</span></div>`).join('') || '<div>aucun poll encore</div>';
}

function renderAgent() {
  const live = [...reviews.values()].find((r) => r.status === 'live');
  const last = polls[0];
  let dot = 'err', text = 'Agent arrêté';
  if (agent.loaded) {
    dot = live ? 'live' : 'ok';
    const next = last ? new Date(last.ts).getTime() + agent.interval * 1000 - Date.now() : null;
    text = live ? `Review de #${live.pr} en cours` : next != null && next > 0
      ? `Actif · prochain poll dans ${Math.floor(next / 60000)}:${String(Math.floor(next / 1000) % 60).padStart(2, '0')}`
      : 'Actif · poll imminent';
  }
  $('agent').innerHTML = `<span class="dot ${dot}"></span><span>${text}</span>`;
  $('toggle').textContent = agent.loaded ? 'Pause' : 'Reprendre';
  $('runNow').disabled = !agent.loaded;
}

function stepHtml(s) {
  if (s.type === 'init') return `<div class="step"><span class="k">start</span><span class="v">${esc(s.model)}</span></div>`;
  if (s.type === 'result') return `<div class="step res"><span class="k">fini</span><span class="v">${fmtDur(s.duration_ms)} · ${s.turns} tours · $${(s.cost || 0).toFixed(2)}</span></div>`;
  if (s.type === 'tool_result') return '';
  return (s.content || []).map((c) => {
    if (c.type === 'tool_use') {
      const i = c.input || {};
      const v = i.command ?? i.file_path ?? (i.pattern ? `${i.pattern}${i.path ? '  in ' + i.path : ''}` : JSON.stringify(i));
      return `<div class="step"><span class="k">${esc(c.name)}</span><span class="v">${esc(String(v).replace(/^\/Users\/eric\/HiveBrite\/pr-review-wt\/pr-\d+\//, '').slice(0, 220))}</span></div>`;
    }
    if (c.type === 'text' && c.text.trim()) return `<div class="step text"><span class="k">pense</span><span class="v">${esc(c.text.slice(0, 280))}${c.text.length > 280 ? '…' : ''}</span></div>`;
    return '';
  }).join('');
}

async function select(id) {
  selected = id;
  renderList();
  const data = await (await fetch(`/api/run/${id}`)).json();
  streams.set(id, data.stream);
  renderDetail(data.body);
}

function renderDetail(body) {
  const r = reviews.get(selected);
  if (!r) return;
  const steps = streams.get(selected) || [];
  const elapsed = r.status === 'live' && r.started ? ` · ${fmtDur(Date.now() - new Date(r.started))}` : '';
  $('detail').innerHTML = `
    <div class="detail-head">
      <div class="t"><a href="${esc(r.url)}" target="_blank" rel="noopener">#${esc(r.pr)}</a> ${esc(r.title)}</div>
      <div class="m">@${esc(r.author)} · ${esc(r.base)} ← ${esc((r.sha || '').slice(0, 9))} · <span class="badge ${r.status}">${LABEL[r.status]}</span><span id="elapsed">${elapsed}</span>
        ${r.comment_url ? ` · <a href="${esc(r.comment_url)}" target="_blank" rel="noopener">voir le commentaire →</a>` : ''}
        ${r.reason ? ` · <span style="color:var(--err)">${esc(r.reason)}</span>` : ''}</div>
    </div>
    <div class="cols">
      <div class="timeline" id="timeline">${steps.map(stepHtml).join('') || '<div class="step"><span class="v">en attente du stream…</span></div>'}</div>
      <div class="review" id="review">${body ? DOMPurify.sanitize(marked.parse(body))
        : r.status === 'live' ? '<div class="waiting"><span class="dot live"></span>Claude lit le diff…</div>'
        : '<div class="waiting">Pas de commentaire produit.</div>'}</div>
    </div>`;
  const tl = $('timeline'); tl.scrollTop = tl.scrollHeight;
}

function connect() {
  const es = new EventSource('/live');
  es.onopen = () => $('sse').innerHTML = '<span class="dot ok"></span><span>live</span>';
  es.onerror = () => $('sse').innerHTML = '<span class="dot err"></span><span>déconnecté</span>';
  es.addEventListener('event', (e) => {
    const ev = JSON.parse(e.data);
    applyEvent(ev);
    if (ev.type === 'review_start' && (!selected || reviews.get(selected)?.status !== 'live')) { selected = ev.id; streams.set(ev.id, []); }
    renderList(); renderAgent();
    if (ev.id && ev.id === selected && ev.type !== 'review_start') select(ev.id); // refresh final body / status
    else if (ev.id === selected) renderDetail(null);
  });
  es.addEventListener('stream', (e) => {
    const { id, line } = JSON.parse(e.data);
    const s = streams.get(id) ?? []; s.push(line); streams.set(id, s);
    if (id === selected) {
      const tl = $('timeline');
      if (tl) { if (s.length === 1) tl.innerHTML = ''; tl.insertAdjacentHTML('beforeend', stepHtml(line)); tl.scrollTop = tl.scrollHeight; }
    }
  });
  es.addEventListener('agent', (e) => { agent = JSON.parse(e.data); renderAgent(); });
}

async function action(name) {
  const res = await fetch(`/api/agent/${name}`, { method: 'POST', headers: { 'X-Dashboard': '1' } });
  const body = await res.json();
  if (!res.ok) alert(body.error); else { agent = body; renderAgent(); }
}
$('runNow').onclick = () => action('run-now');
$('toggle').onclick = () => action(agent.loaded ? 'pause' : 'resume');

(async () => {
  const st = await (await fetch('/api/state')).json();
  agent = st.agent;
  st.events.forEach(applyEvent);
  renderList(); renderAgent();
  const latest = [...reviews.values()].sort((a, b) => (b.started ?? '').localeCompare(a.started ?? ''))[0];
  if (latest) select(latest.id);
  connect();
  setInterval(() => {
    renderAgent();
    const r = reviews.get(selected), el = $('elapsed');
    if (r?.status === 'live' && el) el.textContent = ` · ${fmtDur(Date.now() - new Date(r.started))}`;
  }, 1000);
})();
</script>
</body>
</html>
