<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo" id="brandLogo">·</span><div><b id="brandName">AI</b><small>Dashboard</small></div></div>
    <nav id="nav">
      <a data-page="home"><i>◎</i>Aujourd'hui <span class="count hot" id="c-home"></span></a>
      <div class="navlabel">Mon travail</div>
      <a data-page="mine"><i>⑃</i>Mes PR <span class="count" id="c-mine"></span></a>
      <a data-page="standup"><i>☀</i>Stand-up <span class="dot" id="standupDot"></span></a>
      <a data-page="ideas"><i>💡</i>Innovation <span class="count" id="c-ideas"></span></a>
      <a data-page="tasks"><i>▤</i>Tâches <span class="count" id="c-tasks"></span></a>
      <a data-page="jira"><i>◆</i>Jira <span class="count" id="c-jira"></span></a>
      <a data-page="epics"><i>✦</i>Epics &amp; plans <span class="count" id="c-epics"></span></a>
      <div class="navlabel">Équipe</div>
      <a data-page="reviews"><i>⇄</i>PR de l'équipe <span class="count" id="c-reviews"></span></a>
      <a data-page="radar"><i>◉</i>Radar auto-review <span class="dot" id="radarDot"></span></a>
      <a data-page="brutal"><i>⚡</i>Brutal reviews <span class="count" id="c-brutal"></span></a>
      <a data-page="slack"><i>#</i>Slack filtré <span class="count hot" id="c-slack"></span></a>
      <div class="navlabel">Machine</div>
      <a data-page="fleet"><i>◈</i>Flotte <span class="count" id="c-fleet"></span></a>
      <a data-page="atelier"><i>⑂</i>Atelier</a>
      <a data-page="sessions"><i>▶</i>Sessions <span class="count" id="c-sessions"></span></a>
      <a data-page="usage"><i>$</i>Conso IA</a>
      <a data-page="repos"><i>⌂</i>Repos <span class="count" id="c-repos"></span></a>
      <a data-page="stack"><i>⬢</i>Stack local <span class="dot" id="stackDot"></span></a>
      <a data-page="data"><i>▦</i>Journal &amp; base</a>
      <a data-page="onboarding"><i>✓</i>Onboarding <span class="count hot" id="c-onboarding"></span></a>
    </nav>
    <div class="side-foot">
      <div class="costbox"><small>Coût est. aujourd'hui</small><b id="costToday">–</b></div>
      <div class="muted small" id="syncInfo"></div>
      <div class="side-actions"><button id="syncBtn">⟳ Sync</button><button id="themeBtn" title="Clair / sombre">◐</button></div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div><h1 id="pageTitle"></h1><div class="muted small" id="pageSub"></div></div>
      <span class="spacer"></span>
      <span class="fresh" id="pageFresh"></span>
      <button id="refreshBtn" title="Recharger les données de cette page depuis la source (raccourci : r)">⟳ Actualiser</button>
      <button class="ghost" id="paletteBtn" title="Recherche globale">⌘K</button>
      <button class="primary" id="customBtn">＋ Prompt libre</button>
    </header>
    <div id="banner"></div>
    <main>
      <section class="page" id="page-home"></section>
      <section class="page" id="page-onboarding"></section>
      <section class="page" id="page-repos"></section>
      <section class="page" id="page-mine"><div class="filters" id="f-mine"></div><div id="r-mine"></div></section>
      <section class="page" id="page-tasks"><div class="filters" id="f-tasks"></div><div id="r-tasks"></div></section>
      <section class="page" id="page-jira"><div class="filters" id="f-jira"></div><div id="r-jira"></div></section>
      <section class="page" id="page-epics"><div class="filters" id="f-epics"></div><div id="r-epics"></div></section>
      <section class="page" id="page-reviews"><div class="filters" id="f-reviews"></div><div id="r-reviews"></div></section>
      <section class="page" id="page-brutal"><div id="brutalRules"></div><div class="filters" id="f-brutal"></div><div id="r-brutal"></div></section>
      <section class="page" id="page-sessions"><div class="filters" id="f-sessions"></div><div id="r-sessions"></div></section>
      <section class="page" id="page-standup"></section>
      <section class="page" id="page-ideas"><div class="filters" id="f-ideas"></div><div id="r-ideas"></div></section>
      <section class="page" id="page-radar"></section>
      <section class="page" id="page-slack"><div class="filters" id="f-slack"></div><div id="r-slack"></div></section>
      <section class="page" id="page-usage"><div class="filters" id="f-usage"></div><div id="r-usage"></div></section>
      <section class="page" id="page-data"><div class="filters" id="f-data"></div><div id="r-data"></div></section>
      <section class="page" id="page-fleet"><div class="filters" id="f-fleet"></div><div id="r-fleet"></div></section>
      <section class="page" id="page-atelier"><div class="filters" id="f-atelier"></div><div id="r-atelier"></div></section>
      <section class="page" id="page-stack"></section>
    </main>
  </div>
</div>

<dialog id="modal">
  <form method="dialog" id="choreForm">
    <h2 id="mTitle"></h2>
    <p class="muted small" id="mSub"></p>
    <div class="grid2">
      <label>Modèle <select id="mModel"></select></label>
      <label>Effort <select id="mEffort"></select></label>
    </div>
    <label>Prompt <textarea id="mPrompt" rows="14"></textarea></label>
    <p class="muted small" id="mNote"></p>
    <div class="actions">
      <button value="cancel" formnovalidate>Annuler</button>
      <button class="primary" id="mStart" value="start">Lancer la session</button>
    </div>
  </form>
</dialog>

<dialog id="sessionModal" class="drawer">
  <div class="drawer-head">
    <div><h2 id="sTitle"></h2><div class="muted small" id="sMeta"></div></div>
    <div class="row-actions"><span id="sLinks"></span><button class="ghost" id="sClose" aria-label="Fermer">✕</button></div>
  </div>
  <div class="convo" id="sConvo"></div>
  <form id="sReply" class="reply">
    <textarea id="sText" rows="3" placeholder="Répondre à Claude… (⌘↩ pour envoyer)"></textarea>
    <div class="actions"><span class="muted small" id="sHint"></span><button class="primary" id="sSend">Envoyer</button></div>
  </form>
</dialog>

<dialog id="wtDialog" class="side-drawer"></dialog>

<dialog id="palette" class="palette">
  <input id="pq" placeholder="Aller à… ticket, PR, epic, session, page" autocomplete="off">
  <div id="pres"></div>
</dialog>

<div id="selbar"></div>
<div id="toast"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
